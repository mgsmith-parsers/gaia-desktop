# GAIA Desktop — shared report/UI labels (ENGLISH)
# The first block is the shared report vocabulary;
# the dotted keys below it are this app's own. English is the contract: every key must
# exist there, and a lookup falls back to it per key. See gaia-desktop/README.md.
#
# Six of the shared terms — generated, status, dlRole, interpretations, message, level — are
# not asked for by this app's report, which lays those facts out differently. They are kept so
# a later card can use one without editing 35 files. Nothing else here is unused.

